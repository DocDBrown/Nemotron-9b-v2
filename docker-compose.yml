services:
  nemotron:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Optional (only needed for private/gated models). Leaving blank is fine for public.
        HF_TOKEN: ""
    container_name: nemotron
    network_mode: host
    shm_size: "8gb"
    restart: unless-stopped
    init: true
    runtime: nvidia

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,max_split_size_mb:128"
