services:
  nemotron:
    image: docdbrown/nvidia-nemotron-nano-9b-v2:1.0.0
    container_name: nemotron
    network_mode: host
    shm_size: "8gb"
    restart: unless-stopped
    init: true

    # Prefer this with modern Docker Compose + NVIDIA Container Toolkit
    gpus: all

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,max_split_size_mb:128"
